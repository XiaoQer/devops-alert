services:
  mysql-test:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${II_MYSQL_TEST_ROOT_PASSWORD:?请设置测试数据库密码}
    ports:
      - "127.0.0.1:${II_MYSQL_TEST_PORT:-43306}:3306"
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_bin"]
    healthcheck:
      test:
        ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - incident-intelligence-mysql-test:/var/lib/mysql

volumes:
  incident-intelligence-mysql-test:
